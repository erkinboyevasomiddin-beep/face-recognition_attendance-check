name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-311:
    name: Python 3.11 full verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pip>=26.1.2" "setuptools>=83,<84"
      - run: python -m pip install -c constraints-python311.txt -e ".[dev,recognition]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy backend recognition
      - run: python -m pytest --cov-report=term-missing --cov-report=xml
      - run: python -m pip check
      - run: python -m pip_audit --skip-editable
      - name: CLI and import smoke tests
        run: |
          python scripts/smoke_imports.py
          python -m backend.scripts.init_db --help
          python -m recognition.main --help
          python -m recognition.scripts.evaluate --help
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-311-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
