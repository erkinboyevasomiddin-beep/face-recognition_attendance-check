[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "school-attendance-ai"
version = "0.2.0"
description = "Local face-recognition and FastAPI attendance prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi==0.141.1",
  "httpx2>=2.9,<3",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1.6,<4",
  "numpy==1.23.5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "requests>=2.32.4,<3",
  "sqlalchemy==2.0.51",
  "starlette>=1.3.1,<2",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
recognition = [
  "insightface==0.7.3",
  "onnxruntime==1.22.1",
  "opencv-python==4.11.0.86",
]
dev = [
  "build>=1.3,<2",
  "mypy>=1.16,<2",
  "opencv-python-headless==4.11.0.86",
  "pip-audit==2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.17",
  "setuptools>=83,<84",
  "types-requests>=2.32,<3",
]

[project.scripts]
attendance-init = "backend.scripts.init_db:main"
attendance-create-user = "backend.scripts.create_user:main"
attendance-import-roster = "backend.import_roster:main"
attendance-setup-demo = "backend.scripts.setup_demo:main"
attendance-reset-demo = "backend.scripts.reset_demo_data:main"
recognition-client = "recognition.main:main"
recognition-evaluate = "recognition.scripts.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "recognition"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=backend --cov=recognition --cov-report=term-missing"
testpaths = ["backend/tests", "recognition/tests"]
filterwarnings = [
  "error",
  "ignore:.*on_event is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "*/scripts/*",
  "recognition/enroll.py",
  "recognition/main.py",
  "recognition/recognize_*.py",
  "recognition/app/face_engine.py",
  "recognition/app/video_stream.py",
  "recognition/app/visualization.py",
  "recognition/app/webcam_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local", ".venv", "recognition/models", "recognition/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"backend/scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
  ".venv",
  ".local",
  "backend/tests",
  "recognition/tests",
  "recognition/models",
  "recognition/data",
]
